name: Build PHP binaries

on:
  workflow_call:
    inputs:
      pm-version-major:
        description: 'PocketMine-MP major version'
        required: true
        type: number
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string

env:
  MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

jobs:
  # ---------------------------------------------------------------------------
  # Android arm64: PHP ESTATICO (musl, cross-compile). No genera .so -> sin symlinks.
  # ---------------------------------------------------------------------------
  android:
    name: Android arm64 (static)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c cmake pkg-config

      - name: Prepare compile.sh download cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-android-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-android-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      - name: Compile PHP
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t android-aarch64 -x -j 4 -P ${{ inputs.pm-version-major }} -c ./download_cache -D -z ${{ inputs.php-version-base }}

      - name: Create tarball (verifica symlinks)
        run: |
          ./package.sh ./PHP-${{ inputs.php-version-base }}-Android-arm64-PM${{ inputs.pm-version-major }}.tar.gz bin
          ./package.sh ./Z-PHP-${{ inputs.php-version-base }}-Android-arm64-PM${{ inputs.pm-version-major }}-debugging-symbols.tar.gz bin-debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-PM${{ inputs.pm-version-major }}
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Android-arm64-PM${{ inputs.pm-version-major }}*.tar.gz
            install.log
            compile.sh
          if-no-files-found: error

      - name: Prepare workspace for upload
        if: failure()
        run: tar -czf workspace.tar.gz install_data

      - name: Upload workspace
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-workspace-PM${{ inputs.pm-version-major }}
          path: workspace.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux x86_64 (dinamico, con libs .so + symlinks)
  # ---------------------------------------------------------------------------
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c cmake pkg-config

      - name: Prepare compile.sh download cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-linux-x64-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-linux-x64-

      - name: Compile PHP
        run: |
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t linux64 -j 4 -P ${{ inputs.pm-version-major }} -c ./download_cache -D -z ${{ inputs.php-version-base }}

      - name: Verify FFI
        run: |
          ./bin/php7/bin/php -v
          ./bin/php7/bin/php -m | grep -i '^FFI$'
          ./bin/php7/bin/php -r 'echo FFI::cdef("int abs(int);")->abs(-7), PHP_EOL;' | grep -x 7

      - name: Create tarball (verifica symlinks)
        run: |
          ./package.sh ./PHP-${{ inputs.php-version-base }}-Linux-x86_64-PM${{ inputs.pm-version-major }}.tar.gz bin
          ./package.sh ./Z-PHP-${{ inputs.php-version-base }}-Linux-x86_64-PM${{ inputs.pm-version-major }}-debugging-symbols.tar.gz bin-debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: PHP-${{ inputs.php-version-base }}-Linux-x86_64-PM${{ inputs.pm-version-major }}
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Linux-x86_64-PM${{ inputs.pm-version-major }}*.tar.gz
            install.log
            compile.sh
          if-no-files-found: error

      - name: Prepare workspace for upload
        if: failure()
        run: tar -czf workspace.tar.gz install_data

      - name: Upload workspace
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: PHP-${{ inputs.php-version-base }}-Linux-x86_64-workspace-PM${{ inputs.pm-version-major }}
          path: workspace.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux arm64 "Cobalt" (Azure Cobalt 100 = Neoverse N2). Compila NATIVO en runner arm64.
  # ---------------------------------------------------------------------------
  linux-arm64-cobalt:
    name: Linux arm64 (Cobalt)
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c cmake pkg-config

      - name: Prepare compile.sh download cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-linux-arm64-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-linux-arm64-

      - name: Compile PHP
        run: |
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t linux-arm64-cobalt -j 4 -P ${{ inputs.pm-version-major }} -c ./download_cache -D -z ${{ inputs.php-version-base }}

      - name: Verify FFI
        run: |
          ./bin/php7/bin/php -v
          ./bin/php7/bin/php -m | grep -i '^FFI$'
          ./bin/php7/bin/php -r 'echo FFI::cdef("int abs(int);")->abs(-7), PHP_EOL;' | grep -x 7

      - name: Create tarball (verifica symlinks)
        run: |
          ./package.sh ./PHP-${{ inputs.php-version-base }}-Linux-arm64-Cobalt-PM${{ inputs.pm-version-major }}.tar.gz bin
          ./package.sh ./Z-PHP-${{ inputs.php-version-base }}-Linux-arm64-Cobalt-PM${{ inputs.pm-version-major }}-debugging-symbols.tar.gz bin-debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: PHP-${{ inputs.php-version-base }}-Linux-arm64-Cobalt-PM${{ inputs.pm-version-major }}
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Linux-arm64-Cobalt-PM${{ inputs.pm-version-major }}*.tar.gz
            install.log
            compile.sh
          if-no-files-found: error

      - name: Prepare workspace for upload
        if: failure()
        run: tar -czf workspace.tar.gz install_data

      - name: Upload workspace
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: PHP-${{ inputs.php-version-base }}-Linux-arm64-Cobalt-workspace-PM${{ inputs.pm-version-major }}
          path: workspace.tar.gz
          if-no-files-found: error
